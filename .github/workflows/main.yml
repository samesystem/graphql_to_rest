name: Ruby
on: [push, pull_request]
jobs:
  specs:
    strategy:
      matrix:
        ruby-version: ['3.0', '3.1']

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec rake
      - name: Add coverage to job summary
        if: always() && hashFiles('coverage/.last_run.json') != ''
        run: |
          echo "Line coverage (Ruby ${{ matrix.ruby-version }}): $(jq -r '.result.line' coverage/.last_run.json)%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ruby-${{ matrix.ruby-version }}
          path: coverage/
